[workspace]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
authors = ["touchHLE project contributors"]
homepage = "https://touchhle.org/"

[package]
name = "metalhle"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }

[lib]
# https://users.rust-lang.org/t/making-both-binary-and-cdylib-from-one-package/29105
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "metalhle"
path = "src/bin.rs"

[features]
default = ["static"]
static = [
    "sdl2/bundled",
    "sdl2/static-link",
    "touchHLE_openal_soft_wrapper/static",
    "touchHLE_libxml2_wrapper/static",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
cc = "1.0.83"
cmake = "0.1.49"
gl_generator = "0.14.0"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
openh264 = "0.9.8"
caf = "0.1.0" # ИСПРАВЛЕНИЕ: Добавлен недостающий крейт
hound = "3.5.0"
mach_object = "0.1.17"
plist = "1.8.0"
zip = { version = "0.6.4", default-features = false, features = ["deflate"] }
rusttype = "0.9.3"
# While most Symphonia codecs are (likely) unpatented/have freely licenseable 
# patents as of 2024, all of the AAC profiles except AAC-LC (likely) have 
# active patent claims. The "aac" feature only enables AAC-LC, so it's should 
# be ok.
# (The above statements should not understood as legal claims/advice.)
symphonia = { version = "0.6.0", default-features = false, features = [
    # formats
    "aiff", "caf", "isomp4", "wav",
    # codecs
    "aac", "adpcm", "alac", "mp3", "pcm",
    # standalone metadata readers
    # (Ported from HyperHLE: without `id3v2` the Id3v2Reader is never
    # registered with the default Probe, and probing an ID3v2-tagged MP3
    # degenerates into a capped byte-scan that false-matches inside cover
    # art, so tagged MP3s frequently fail to open at all.)
    "ape", "id3v1", "id3v2"
] }
quick-xml = "0.38.4"
digest = "0.10.7"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.8"
encoding_rs = "0.8.35"
# We currently use a fork of rust-sdl2 because we need a fix for Android builds
# that's not upstream yet.
# The HIDAPI feature is enabled because rust-sdl2 hides the SDL2 sensor features
# behind this, but the actual HIDAPI is not used by touchHLE (see window.rs).
# Note that the submodule in vendor/SDL2/ must use exactly the same revision of
# SDL2 that rust-sdl2 uses, so that the Android JNI interface matches.
sdl2 = { git = "https://github.com/touchHLE/rust-sdl2", tag = "touchHLE-3", features = ["hidapi", "raw-window-handle"] }
sdl2-sys = { git = "https://github.com/touchHLE/rust-sdl2", tag = "touchHLE-3" }
raw-window-handle = "0.6.2"
wgpu = { version = "0.20.1", default-features = false, features = ["wgsl", "metal", "dx12", "glsl", "vulkan-portability"] }
pollster = "0.3.0"
bytemuck = { version = "1.16.3", features = ["derive"] }
touchHLE_dynarmic_wrapper = { path = "src/cpu/dynarmic_wrapper" }
touchHLE_gl_bindings = { path = "src/gles/gl_bindings" }
touchHLE_libxml2_wrapper = { path = "src/frameworks/libxml2_wrapper" }
touchHLE_openal_soft_wrapper = { path = "src/audio/openal_soft_wrapper" }
touchHLE_pvrt_decompress_wrapper = { path = "src/image/pvrt_decompress_wrapper" }
touchHLE_stb_image_wrapper = { path = "src/image/stb_image_wrapper" }
touchHLE_version = { path = "src/version" }
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }
nibarchive = "0.1.0"
libc = "0.2.180"
corosensei = "0.3.2"
rusqlite = { version = "0.29.0", features = ["bundled"] }
lazy_static = "1.4.0"
regex = "1.10.0"
bzip2 = { version = "0.4", features = ["static"] }
# Blocking HTTP client used to give NSURLConnection / NSURLSession real
# networking (pure-Rust TLS via rustls, so no system OpenSSL dependency).
ureq = { version = "2.9", features = ["tls", "gzip"] }

# PERF: use mimalloc as the global allocator (see src/lib.rs). Ported from HyperHLE.
# PIN: the `v2` feature is required. Without it, libmimalloc-sys 0.1.49 builds
# mimalloc v3 (locked resolution: v3.3.2), which has an upstream-confirmed
# multithreading crash class in 3.3.0-3.3.2 (microsoft/mimalloc #1287, #1288:
# use-after-free under concurrent free of per-thread cache blocks).
# `default-features = false` also skips libmimalloc-sys's optional secure
# mode, which would otherwise route every free through a double-free check
# that additionally goes through Scudo hardening.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

[build-dependencies]
cargo-license = "0.5.1"
cc = { workspace = true }
cmake = { workspace = true }
gl_generator = { workspace = true }


# Patched copy of symphonia-codec-aac 0.6.0: its AAC section-data parser can
# index out of bounds (len 64, index 64) on unusual but valid streams and
# panic, taking down the whole emulator. The vendored copy under
# vendor/symphonia-codec-aac turns that into a recoverable decode error.
[patch.crates-io]
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "debuginfo"
